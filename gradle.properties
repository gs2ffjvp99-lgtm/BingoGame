# Memory for the Gradle daemon and UTF-8 source files (needed for comments
# or strings that contain non-English characters).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use AndroidX libraries if any are added later.
android.useAndroidX=true
# Each module only sees its own R class (faster, cleaner builds).
android.nonTransitiveRClass=true
